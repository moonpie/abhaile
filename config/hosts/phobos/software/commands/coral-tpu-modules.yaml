id: coral-tpu-modules
name: Load Coral TPU kernel modules
description: Declare the phobos-specific Coral module prerequisites.
operation: kernel-modules
execution_policy: admitted
parameters:
  modules:
    - name: gasket
      options: []
    - name: apex
      options: []
effects:
  - kind: path
    target: /etc/modules-load.d/abhaile-coral-tpu-modules.conf
    role: declaration
  - kind: module
    target: gasket
    role: runtime
  - kind: module
    target: apex
    role: runtime
validation: modules-loadable
expected_results:
  - Both Coral modules are declared for boot and are loadable
