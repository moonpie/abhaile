id: gasket-dkms
name: Build gasket-dkms package
description: Declare a containerized build plan blocked until immutable inputs are admitted.
operation: container-build
execution_policy: phase4-integrity-blocked
parameters:
  url: https://github.com/jnicolson/gasket-builder.git
  source_ref: v1.0-18-3
  containerfile_base: docker.io/library/debian:trixie
  output_glob: gasket-dkms*.deb
effects:
  - kind: artifact-set
    target: /var/lib/abhaile/builds/gasket-dkms
    role: output
    pattern: gasket-dkms*.deb
    cardinality: 1
validation: package-artifact
expected_results:
  - Exactly one gasket-dkms Debian package is produced and validated before installation
