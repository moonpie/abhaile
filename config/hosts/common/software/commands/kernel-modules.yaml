id: kernel-modules
name: Load required kernel modules
description: Declare modules and persistent options without an imperative shell recipe.
operation: kernel-modules
execution_policy: admitted
parameters:
  modules:
    - name: nct6683
      options: [force=on]
    - name: 8021q
      options: []
effects:
  - kind: path
    target: /etc/modules-load.d/abhaile-kernel-modules.conf
    role: declaration
  - kind: path
    target: /etc/modprobe.d/abhaile-nct6683.conf
    role: options
  - kind: module
    target: nct6683
    role: runtime
  - kind: module
    target: 8021q
    role: runtime
validation: modules-loadable
expected_results:
  - Both modules are declared for boot and are loadable
