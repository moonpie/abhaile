id: unattended-upgrades
name: Enable unattended upgrades
description: Declare the Debian unattended-upgrades debconf state.
operation: unattended-upgrades
execution_policy: admitted
parameters:
  enabled: true
effects:
  - kind: debconf
    target: unattended-upgrades
    role: configuration
validation: debconf-state
expected_results:
  - Automatic security updates are enabled in Debian package configuration
