id: sops
name: Install pinned SOPS binary
description: Fetch and verify the declared release before publication.
operation: binary-download
execution_policy: admitted
parameters:
  url: https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64
  sha256: 620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a
  destination: /usr/local/bin/sops
  mode: "0755"
  max_bytes: 134217728
  redirect_origins:
    - https://release-assets.githubusercontent.com
  max_redirects: 3
effects:
  - kind: path
    target: /usr/local/bin/sops
    role: primary
validation: binary-version
expected_results:
  - /usr/local/bin/sops is a regular executable matching the declared digest
