name: chrony-b
systemd:
  network: service-32
apply:
  config_change_restart_unit: chrony.service
composition:
  systemd:
    - source: chrony-common/systemd/network.conf
      destination: /etc/systemd/system/chrony.service.d/10-abhaile.conf
      enable: true
      start: true
  config:
    - source:
        template: chrony-common/config/chrony.conf.j2
        variables:
          bind_ip: '%%network.services.chrony-b.address | strip_cidr%%'
          peer_ip: '%%network.services.chrony-a.address | strip_cidr%%'
          stratum: 11
      destination: /etc/chrony/chrony.conf
