name: home-assistant
podman:
  user: root
  network: ipvlan-l2
composition:
  ingress:
    dmz:
      blocks:
        - home-assistant/caddy/dmz-ingress.txt
    internal:
      blocks:
        - home-assistant/caddy/internal-ingress.txt
  container:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    pull_policy: missing
    named_volumes:
      - name: config
        host_path: /srv/home-assistant/config
        mount_path: /config
        host_owner: root
        host_group: root
        host_mode: '0750'
