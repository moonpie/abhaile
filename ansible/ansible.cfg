# Quarantined scaffold using the existing GitOps checkout and virtual environment.
[defaults]
roles_path = /opt/abhaile/ansible/roles
collections_scan_sys_path = False
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
bin_ansible_callbacks = False
gathering = explicit
fact_caching = memory
keep_remote_files = False
interpreter_python = /opt/abhaile/.venv/bin/python

[diff]
always = False

[privilege_escalation]
become = False
