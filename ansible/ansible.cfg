# Quarantined scaffold; the protected planner supplies absolute runtime paths.
[defaults]
roles_path = /usr/lib/abhaile-ansible-runtime/disabled-roles
collections_path = /usr/lib/abhaile-ansible-runtime/collections
collections_scan_sys_path = False
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
bin_ansible_callbacks = False
gathering = explicit
fact_caching = memory
no_log = True
keep_remote_files = False
interpreter_python = /usr/lib/abhaile-ansible-runtime/bin/python

[diff]
always = False

[privilege_escalation]
become = False
