- name: Select the validated rootless publication context
  ansible.builtin.set_fact:
    abhaile_rootless_context: '{{ abhaile_rootless_contexts[abhaile_rootless_user] }}'
- name: Inspect the named-user Quadlet directory
  ansible.builtin.stat:
    path: '{{ abhaile_rootless_context.home }}/.config/containers/systemd'
    follow: false
  register: abhaile_rootless_quadlet_directory
- name: Reject a redirected or non-directory Quadlet root
  ansible.builtin.assert:
    that:
      - not abhaile_rootless_quadlet_directory.stat.islnk | default(false)
      - not abhaile_rootless_quadlet_directory.stat.exists or abhaile_rootless_quadlet_directory.stat.isdir | default(false)
    quiet: true
- name: Clean matching candidate-only named-user unit files
  ansible.builtin.include_tasks: cleanup_user.yml
  when: abhaile_rootless_context.cleanup | default([]) | length > 0
- name: Ensure the user's Quadlet publication directory
  ansible.builtin.file:
    path: '{{ abhaile_rootless_context.home }}/.config/containers/systemd'
    state: directory
    owner: '{{ abhaile_rootless_user }}'
    group: '{{ abhaile_rootless_context.gid }}'
    mode: '0700'
  when: abhaile_rootless_context.entries | length > 0
- name: Report publication pending a new Quadlet directory
  ansible.builtin.debug:
    msg: Rootless Quadlets will be published after their directory is created
  changed_when: true
  when: ansible_check_mode and not abhaile_rootless_quadlet_directory.stat.exists and abhaile_rootless_context.entries
    | length > 0
- name: Publish the named-user Quadlet files
  ansible.builtin.copy:
    src: '{{ abhaile_rendered_root }}/{{ item.render_path }}'
    dest: '{{ item.target_path }}'
    remote_src: true
    owner: '{{ abhaile_rootless_user }}'
    group: '{{ abhaile_rootless_context.gid }}'
    mode: '0644'
  loop: '{{ abhaile_rootless_context.entries }}'
  loop_control:
    label: '{{ item.target_path }}'
  when: not ansible_check_mode or abhaile_rootless_quadlet_directory.stat.exists
  register: abhaile_rootless_user_publications
- name: Retain per-user publication results until activation
  ansible.builtin.set_fact:
    abhaile_rootless_publications: '{{ abhaile_rootless_publications | combine({abhaile_rootless_user: abhaile_rootless_user_publications.results})
      }}'
