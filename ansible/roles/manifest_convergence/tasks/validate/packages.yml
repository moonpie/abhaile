- name: Validate package operation
  ansible.builtin.assert:
    that:
      - abhaile_host_global_isolated | default(false) | bool
      - operation.kind == 'software.packages'
      - operation.action == 'install'
      - operation.validation == 'software-result'
      - operation.target is none
      - operation.parameters.keys() | list == ['packages']
      - operation.parameters.packages is sequence
      - operation.parameters.packages is not string
      - operation.parameters.packages | length > 0
      - operation.effects | length == operation.parameters.packages | length
      - abhaile_source_stat.stat.isreg
      - abhaile_source_stat.stat.checksum == operation.source_sha256
    fail_msg: "Package operation data shape is invalid."
  no_log: true
  diff: false
