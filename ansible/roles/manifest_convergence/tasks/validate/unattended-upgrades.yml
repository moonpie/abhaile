- name: Validate unattended upgrades prerequisite operation
  ansible.builtin.assert:
    that:
      - abhaile_host_global_isolated | default(false) | bool
      - operation.kind == 'software.prerequisite'
      - operation.action == 'ensure'
      - operation.parameters.keys() | list == ['enabled']
      - operation.parameters.enabled is boolean
      - operation.effects | length == 1
    fail_msg: "Unattended-upgrades authority is invalid or not isolated."
  no_log: true
  diff: false
