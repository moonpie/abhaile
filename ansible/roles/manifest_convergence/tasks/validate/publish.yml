- name: Validate file publication operation
  ansible.builtin.assert:
    that:
      - operation.target is string
      - operation.target is match('^/')
      - "'..' not in operation.target.split('/')"
      - operation.owner is string
      - operation.group is string
      - operation.mode is match('^0[0-7]{3}$')
      - >-
        (operation.kind == 'coredns.zone' and operation.parameters.keys() | list == ['zone'] and operation.parameters.zone
        is match('^[A-Za-z0-9.-]+$')) or (operation.kind != 'coredns.zone' and operation.parameters | length ==
        0)
      - operation.kind != 'host.sysusers' or (abhaile_host_global_isolated | default(false) | bool)
      - operation.action == 'publish'
      - >-
        operation.kind in ['caddy.config', 'coredns.config', 'coredns.zone', 'host.authorized_keys', 'host.sudoers',
        'host.sysusers', 'quadlet.build', 'quadlet.container', 'quadlet.image', 'quadlet.network', 'quadlet.pod',
        'quadlet.volume', 'resolved.config', 'resolved.dropin', 'service.config', 'service.env', 'systemd.dropin',
        'systemd.unit', 'vault.config', 'vault.template']
      - >-
        (operation.kind == 'host.sudoers' and operation.validation == 'sudoers') or (operation.kind == 'host.sysusers'
        and operation.validation == 'sysusers') or (operation.kind in ['systemd.unit', 'systemd.dropin'] and operation.validation
        == 'systemd') or (operation.kind in ['resolved.config', 'resolved.dropin'] and operation.validation == 'resolved')
        or (operation.kind == 'caddy.config' and operation.validation == 'caddy') or (operation.kind == 'coredns.config'
        and operation.validation == 'coredns') or (operation.kind == 'coredns.zone' and operation.validation ==
        'coredns-zone') or (operation.kind is match('^quadlet\\.') and operation.validation == 'quadlet') or (operation.kind
        == 'vault.config' and operation.validation == 'vault-agent') or (operation.kind not in ['host.sudoers',
        'host.sysusers', 'systemd.unit', 'systemd.dropin', 'resolved.config', 'resolved.dropin', 'caddy.config',
        'coredns.config', 'coredns.zone', 'quadlet.build', 'quadlet.container', 'quadlet.image', 'quadlet.network',
        'quadlet.pod', 'quadlet.volume', 'vault.config'] and operation.validation == 'structural')
      - abhaile_source_stat.stat.exists
      - abhaile_source_stat.stat.isreg
      - not abhaile_source_stat.stat.islnk
      - abhaile_source_stat.stat.checksum == operation.source_sha256
    fail_msg: "File publication operation data shape is invalid."
  no_log: true
  diff: false
- name: Validate sealed publication content before any mutation
  abhaile_publish:
    root: "{{ abhaile_execution_root }}"
    target: "{{ operation.target }}"
    state: file
    source: "{{ operation.source }}"
    sha256: "{{ operation.source_sha256 }}"
    uid: "{{ operation.owner }}"
    gid: "{{ operation.group }}"
    mode: "{{ operation.mode }}"
    validation: "{{ operation.validation }}"
    zone: "{{ operation.parameters.zone | default(omit) }}"
    validate_only: true
  changed_when: false
  no_log: true
  diff: false
