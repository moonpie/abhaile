- name: Acquire immutable admitted binary
  abhaile_download:
    root: "{{ abhaile_execution_root }}"
    url: "{{ operation.parameters.url }}"
    destination: "{{ operation.parameters.destination }}"
    sha256: "{{ operation.parameters.sha256 }}"
    mode: "{{ operation.parameters.mode }}"
    uid: "{{ operation.owner }}"
    gid: "{{ operation.group }}"
    max_bytes: "{{ operation.parameters.max_bytes }}"
    redirect_origins: "{{ operation.parameters.redirect_origins }}"
    max_redirects: "{{ operation.parameters.max_redirects }}"
  register: abhaile_binary_download
  no_log: true
  diff: false
- name: Record changed download owner
  ansible.builtin.set_fact:
    abhaile_changed_owners: >-
      {{ abhaile_changed_owners | combine({operation.owner_ref ~ '|' ~ operation.context: true}) }}
  when: abhaile_binary_download.changed
  changed_when: false
  no_log: true
  diff: false
