- name: Converge managed directory
  abhaile_publish:
    root: "{{ abhaile_execution_root }}"
    target: "{{ operation.target }}"
    state: directory
    uid: "{{ operation.owner }}"
    gid: "{{ operation.group }}"
    mode: "{{ operation.mode }}"
  register: abhaile_directory
  no_log: true
  diff: false
- name: Record changed directory owner
  ansible.builtin.set_fact:
    abhaile_changed_owners: >-
      {{ abhaile_changed_owners | combine({operation.owner_ref ~ '|' ~ operation.context: true}) }}
  when: abhaile_directory.changed
  changed_when: false
  no_log: true
  diff: false
