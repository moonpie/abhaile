- name: Require a non-empty networkd selection
  ansible.builtin.assert:
    that:
      - abhaile_networkd_entries is sequence
      - abhaile_networkd_entries is not string
      - >-
        abhaile_networkd_entries | length + abhaile_networkd_cleanup_entries | default([]) | length > 0
      - abhaile_networkd_cleanup_entries | default([]) is sequence
      - abhaile_networkd_cleanup_entries | default([]) is not string
      - abhaile_networkd_early_restore | default(false) is boolean
      - abhaile_networkd_adoption | default(false) is boolean
    fail_msg: Networkd desired or cleanup selection must be non-empty
    quiet: true
  tags: [networkd_contract]
- name: Require closed candidate-only networkd cleanup identities
  ansible.builtin.assert:
    that:
      - item.kind in ['networkd.netdev', 'networkd.network', 'networkd.dropin']
      - item.owner_ref is match('^iface:[A-Za-z0-9_.:-]+$')
      - item.target_path is string
      - item.target_path.startswith('/etc/systemd/network/')
      - item.target_path != '/etc/systemd/network/'
      - "'//' not in item.target_path"
      - "'/./' not in item.target_path"
      - "'/../' not in item.target_path"
      - not item.target_path.endswith('/.')
      - not item.target_path.endswith('/..')
      - >-
        item.kind != 'networkd.netdev' or item.target_path | basename is match('^[0-9]+-' ~ networkd_interface_escaped
        ~ '\.netdev$')
      - >-
        item.kind != 'networkd.network' or item.target_path | basename is match('^[0-9]+-' ~ networkd_interface_escaped
        ~ '\.network$')
      - >-
        item.kind != 'networkd.dropin' or item.target_path | dirname | basename is match('^[0-9]+-' ~ networkd_interface_escaped
        ~ '\.network\.d$')
      - >-
        item.kind != 'networkd.dropin' or item.target_path | basename is match('^[A-Za-z0-9_.-]+\.conf$')
      - item.candidate_sha256 is match('^[0-9a-f]{64}$')
      - item.live_sha256 == item.candidate_sha256
    fail_msg: Candidate-only networkd cleanup entry lacks matching file identity evidence
    quiet: true
  loop: "{{ abhaile_networkd_cleanup_entries | default([]) }}"
  loop_control:
    label: "{{ item.target_path | default('invalid networkd cleanup entry') }}"
  vars:
    networkd_interface_escaped: "{{ item.owner_ref | regex_replace('^iface:', '') | regex_escape }}"
  tags: [networkd_contract]
- name: Reset changed networkd owners
  ansible.builtin.set_fact:
    abhaile_changed_networkd_owners: []
- name: Require networkctl before network mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/networkctl
      - --version
  changed_when: false
  check_mode: false
  when: not abhaile_networkd_early_restore | default(false)
- name: Inspect legacy networking backend enablement
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - networking.service
  changed_when: false
  failed_when: false
  check_mode: false
  register: abhaile_legacy_networking_enabled
  when: not abhaile_networkd_early_restore | default(false)
- name: Refuse implicit network backend adoption
  ansible.builtin.assert:
    that:
      - >-
        abhaile_legacy_networking_enabled.rc != 0 or abhaile_legacy_networking_enabled.stdout | trim not in ['enabled',
        'enabled-runtime', 'linked', 'linked-runtime', 'alias'] or abhaile_networkd_adoption | default(false)
    fail_msg: >-
      networking.service is still enabled; use the explicit networkd adoption playbook before ordinary reconciliation
    quiet: true
  when: not abhaile_networkd_early_restore | default(false)
- name: Validate common networkd manifest fields
  ansible.builtin.include_role:
    name: manifest_entry_preflight
    apply:
      tags: [networkd_contract]
  vars:
    abhaile_preflight_entries: "{{ abhaile_networkd_entries }}"
  tags: [networkd_contract]
- name: Validate the closed networkd file contract
  ansible.builtin.assert:
    that:
      - item.kind in ['networkd.netdev', 'networkd.network', 'networkd.dropin']
      - item.owner_ref is match('^iface:[A-Za-z0-9_.:-]+$')
      - item.target_path.startswith('/etc/systemd/network/')
      - >-
        item.kind != 'networkd.netdev' or item.target_path | basename is match('^[0-9]+-' ~ networkd_interface_escaped
        ~ '\\.netdev$')
      - >-
        item.kind != 'networkd.network' or item.target_path | basename is match('^[0-9]+-' ~ networkd_interface_escaped
        ~ '\\.network$')
      - >-
        item.kind != 'networkd.dropin' or not item.is_directory | default(false) or item.target_path.rstrip('/')
        | basename is match('^[0-9]+-' ~ networkd_interface_escaped ~ '\\.network\\.d$')
      - >-
        item.kind != 'networkd.dropin' or item.is_directory | default(false) or item.target_path | dirname | basename
        is match('^[0-9]+-' ~ networkd_interface_escaped ~ '\\.network\\.d$')
      - >-
        item.kind != 'networkd.dropin' or item.is_directory | default(false) or item.target_path | basename is match('^[A-Za-z0-9_.-]+\\.conf$')
      - >-
        not item.is_directory | default(false) or (networkd_apply_hints is mapping and networkd_apply_hints == networkd_directory_hints)
      - item.is_directory | default(false) or networkd_apply_hints is none
    fail_msg: Networkd entry violates its closed file contract
    quiet: true
  loop: "{{ abhaile_networkd_entries }}"
  loop_control:
    label: "{{ item.target_path | default('invalid networkd entry') }}"
  vars:
    networkd_interface_escaped: "{{ item.owner_ref | regex_replace('^iface:', '') | regex_escape }}"
    networkd_directory_hints:
      owner: root
      group: root
      mode: "0755"
    networkd_apply_hints: "{{ item.apply_hints | default(none) }}"
  tags: [networkd_contract]
- name: Inspect existing networkd netdev definitions
  ansible.builtin.stat:
    path: "{{ item.target_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ abhaile_networkd_entries }}"
  loop_control:
    label: "{{ item.target_path }}"
  when: item.kind == 'networkd.netdev'
  register: abhaile_networkd_netdev_targets
  tags: [networkd_contract]
- name: Refuse existing networkd netdev definition changes
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or (item.stat.isreg and not item.stat.islnk and item.stat.checksum == item.item.sha256)
    fail_msg: Existing networkd netdev definition changes require maintenance-gated delete/recreate proof
    quiet: true
  loop: "{{ abhaile_networkd_netdev_targets.results }}"
  loop_control:
    label: "{{ item.item.target_path }}"
  when: not item.skipped | default(false)
  tags: [networkd_contract]
- name: Recheck candidate-only networkd files immediately before removal
  ansible.builtin.stat:
    path: "{{ item.target_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ abhaile_networkd_cleanup_entries | default([]) }}"
  loop_control:
    label: "{{ item.target_path }}"
  register: abhaile_networkd_cleanup_stats
- name: Refuse changed or redirected candidate-only networkd files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.checksum == item.item.candidate_sha256
    fail_msg: Candidate-only networkd file changed before cleanup
    quiet: true
  loop: "{{ abhaile_networkd_cleanup_stats.results }}"
  loop_control:
    label: "{{ item.item.target_path }}"
- name: Remove matching candidate-only networkd files
  ansible.builtin.file:
    path: "{{ item.target_path }}"
    state: absent
  loop: "{{ abhaile_networkd_cleanup_entries | default([]) }}"
  loop_control:
    label: "{{ item.target_path }}"
  register: abhaile_networkd_cleanup_removals
- name: Record owners changed by candidate-only cleanup
  ansible.builtin.set_fact:
    abhaile_changed_networkd_owners: >-
      {{ abhaile_changed_networkd_owners + [item.item.owner_ref] }}
  loop: "{{ abhaile_networkd_cleanup_removals.results }}"
  loop_control:
    label: "{{ item.item.target_path }}"
  when: item.changed
- name: Publish networkd entries in manifest order
  ansible.builtin.include_tasks: publish_entry.yml
  loop: "{{ abhaile_networkd_entries }}"
  loop_control:
    loop_var: abhaile_networkd_entry
    label: "{{ abhaile_networkd_entry.target_path }}"
- name: Enable and start the adopted networkd backend
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true
    state: started
  register: abhaile_networkd_backend_activation
  when: not abhaile_networkd_early_restore | default(false)
- name: Reload networkd configuration once after publication
  ansible.builtin.command:
    argv:
      - /usr/bin/networkctl
      - reload
  changed_when: true
  when:
    - not ansible_check_mode
    - not abhaile_networkd_early_restore | default(false)
    - abhaile_changed_networkd_owners | length > 0
- name: Reconfigure changed networkd owners in manifest order
  ansible.builtin.command:
    argv:
      - /usr/bin/networkctl
      - reconfigure
      - "{{ item | regex_replace('^iface:', '') }}"
  changed_when: true
  loop: "{{ abhaile_changed_networkd_owners | unique }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - not abhaile_networkd_early_restore | default(false)
