- name: ensure abhaile python virtualenv exists
  ansible.builtin.command:
    cmd: >-
      python3 -m venv /opt/abhaile/.venv
  args:
    creates: /opt/abhaile/.venv/bin/python
  become: true
  become_user: abhaile
- name: install abhaile python dependencies
  ansible.builtin.command:
    cmd: >-
      /opt/abhaile/.venv/bin/pip install -r /opt/abhaile/requirements.txt
  args:
    chdir: /opt/abhaile
  register: abhaile_pip_install
  changed_when: abhaile_pip_install.rc == 0
  failed_when: abhaile_pip_install.rc != 0
  become: true
  become_user: abhaile
