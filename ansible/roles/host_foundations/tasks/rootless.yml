- name: Inspect rootless linger marker
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ abhaile_rootless_account.key }}"
    follow: false
    get_checksum: false
  register: abhaile_linger_marker
- name: Refuse redirected rootless linger markers
  ansible.builtin.assert:
    that:
      - not abhaile_linger_marker.stat.islnk | default(false)
      - not abhaile_linger_marker.stat.exists or abhaile_linger_marker.stat.isreg | default(false)
    quiet: true
- name: Enable declared user lingering through logind
  ansible.builtin.command:
    argv: [/usr/bin/loginctl, enable-linger, "{{ abhaile_rootless_account.key }}"]
  when:
    - not ansible_check_mode
    - abhaile_rootless_account.value.rootless.linger | default(true)
    - not abhaile_linger_marker.stat.exists
- name: Observe the provisioned rootless user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ abhaile_rootless_account.key }}"
  when: not ansible_check_mode
- name: Start declared rootless user manager
  ansible.builtin.systemd_service:
    name: "user@{{ getent_passwd[abhaile_rootless_account.key][1] }}.service"
    state: started
  when:
    - not ansible_check_mode
- name: Report rootless runtime preparation pending live enrollment
  ansible.builtin.debug:
    msg: "User {{ abhaile_rootless_account.key }} runtime preparation remains pending until live enrollment"
  when: ansible_check_mode
